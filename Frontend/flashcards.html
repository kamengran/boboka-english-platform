<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>单词卡 | BoBoKa English</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="app.css">
    <script src="shared.js"></script>
</head>

<body>

<div id="site-header"></div>

<main class="app-page">

    <section class="app-hero">
        <div class="app-hero-inner">
            <span class="app-eyebrow">Flashcards</span>
            <h1>本课单词卡</h1>
            <p>使用当前 Lesson 的单词练习。点击卡片翻面，然后标记“认识”或“需要练习”。</p>
        </div>
    </section>

    <div class="app-wrap">

        <div id="pickerArea" style="display:none;"></div>

        <div id="loadingArea" class="app-card app-message">
            <h2>正在读取单词...</h2>
        </div>

        <div id="errorArea" class="app-card app-message" style="display:none;">
            <h2>暂时无法读取单词</h2>
            <p id="errorText"></p>
        </div>

        <div id="emptyArea" class="app-card app-message" style="display:none;">
            <h2 id="emptyTitle">本课暂时没有单词</h2>
            <p id="emptyText"></p>
            <div class="app-actions center">
                <a id="emptyBack" href="courses.html" class="app-btn secondary">返回课程</a>
            </div>
        </div>

        <div id="deckArea" style="display:none;">

            <div class="lesson-bar">
                <div class="lesson-bar-title">
                    <span id="courseLabel"></span>
                    <h2 id="lessonTitle"></h2>
                    <p id="lessonChinese"></p>
                </div>
                <a id="backLesson" href="courses.html" class="app-back">← 返回本课</a>
            </div>

            <div class="flash-meta">
                <div class="flash-counts">
                    <span>第 <b id="posText">1</b> / <b id="totalText">1</b> 张</span>
                    <span>✓ 认识 <b id="knownCount">0</b></span>
                    <span>⟳ 需要练习 <b id="practiceCount">0</b></span>
                </div>
                <div>
                    <button id="modeButton" type="button" class="app-btn secondary" style="min-height:34px;padding:0 14px;">
                        复习“需要练习”
                    </button>
                </div>
            </div>

            <div class="bar" style="margin-bottom:16px;"><i id="deckBar" style="width:0%"></i></div>

            <div class="flash-scene">
                <button id="card" class="flash-card" type="button" aria-label="翻转单词卡">

                    <div class="flash-face front">
                        <span id="statusFront" class="flash-status" style="display:none;"></span>
                        <div id="fWord" class="flash-word"></div>
                        <div id="fIpa" class="flash-ipa"></div>
                        <div id="fCategory" class="flash-hint"></div>
                        <div class="flash-hint">点击翻面 · 空格键</div>
                    </div>

                    <div class="flash-face back">
                        <span id="statusBack" class="flash-status" style="display:none;"></span>
                        <div id="bChinese" class="flash-chinese"></div>
                        <div id="bWord" class="flash-ipa"></div>
                        <div class="flash-hint">点击翻回正面</div>
                    </div>

                </button>
            </div>

            <div class="app-actions center">
                <button id="prevButton" type="button" class="app-btn secondary">← 上一张</button>
                <button id="practiceButton" type="button" class="app-btn warn">需要练习</button>
                <button id="knownButton" type="button" class="app-btn good">认识</button>
                <button id="nextButton" type="button" class="app-btn secondary">下一张 →</button>
            </div>

            <div class="app-actions center">
                <button id="shuffleButton" type="button" class="app-btn secondary">🔀 打乱顺序</button>
                <button id="resetButton" type="button" class="app-btn secondary">重置标记</button>
            </div>

            <p id="saveWarning" class="app-muted" style="text-align:center;margin-top:16px;color:#c0392b;"></p>

            <p class="app-muted" style="text-align:center;margin-top:8px;">
                “认识 / 需要练习”的标记保存在你的账户里，换设备也不会丢。
            </p>

        </div>

    </div>

</main>

<div id="site-footer"></div>

<script>

const params = BoBoKa.query();

const courseCode = params.get("course") || "speaking1";

const hasLesson = params.has("lesson");

const lessonNumber = Number(params.get("lesson") || 0);

const $ = id => document.getElementById(id);

const show = (id, on) => { $(id).style.display = on ? "block" : "none"; };


let words = [];          // 本课全部单词
let order = [];          // 当前显示顺序（words 的下标）
let pos = 0;
let flipped = false;
let reviewMode = false;

const known = new Set();     // word id
const practice = new Set();  // word id


// 每次标记都保存到服务器
function saveMark(wordId, status) {

    BoBoKa.put(
        BoBoKa.lessonApi(courseCode, lessonNumber, "/flashcards"),
        { vocabulary_id: wordId, status: status }
    ).catch(error => {

        $("saveWarning").textContent =
            "⚠ 标记没有保存成功：" + error.message;

    });
}


function buildOrder(shuffleIt) {

    let indexes = words.map((_, i) => i);

    if (reviewMode) {
        indexes = indexes.filter(i => practice.has(words[i].id));
    }

    if (shuffleIt) {
        for (let i = indexes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indexes[i], indexes[j]] = [indexes[j], indexes[i]];
        }
    }

    order = indexes;
    pos = 0;
}


function render() {

    $("knownCount").textContent = known.size;
    $("practiceCount").textContent = practice.size;

    $("modeButton").textContent =
        reviewMode ? "返回全部单词" : "复习“需要练习”";

    if (order.length === 0) {

        // 复习模式下没有需要练习的单词
        $("fWord").textContent = "🎉";
        $("fIpa").textContent = "没有需要练习的单词";
        $("fCategory").textContent = "";
        $("bChinese").textContent = "🎉";
        $("bWord").textContent = "";
        $("posText").textContent = 0;
        $("totalText").textContent = 0;
        $("deckBar").style.width = "0%";
        $("statusFront").style.display = "none";
        $("statusBack").style.display = "none";
        return;
    }

    const w = words[order[pos]];

    $("fWord").textContent = w.word;
    $("fIpa").textContent = w.ipa || "";
    $("fCategory").textContent =
        w.category
            ? w.category + (w.chineseCategory ? " · " + w.chineseCategory : "")
            : "";

    $("bChinese").textContent = w.chinese || "";
    $("bWord").textContent = w.word + (w.ipa ? "  " + w.ipa : "");

    $("posText").textContent = pos + 1;
    $("totalText").textContent = order.length;
    $("deckBar").style.width = ((pos + 1) / order.length * 100) + "%";

    for (const id of ["statusFront", "statusBack"]) {

        const el = $(id);

        if (known.has(w.id)) {
            el.textContent = "认识";
            el.className = "flash-status known";
            el.style.display = "";
        }

        else if (practice.has(w.id)) {
            el.textContent = "需要练习";
            el.className = "flash-status practice";
            el.style.display = "";
        }

        else {
            el.style.display = "none";
        }

    }

    $("card").classList.toggle("flipped", flipped);
}


function go(step) {

    if (order.length === 0) return;

    pos = (pos + step + order.length) % order.length;

    flipped = false;

    render();
}


function mark(kind) {

    if (order.length === 0) return;

    const w = words[order[pos]];

    if (kind === "known") {
        known.add(w.id);
        practice.delete(w.id);
    }

    else {
        practice.add(w.id);
        known.delete(w.id);
    }

    saveMark(w.id, kind === "known" ? "known" : "practice");

    // 复习模式：标记为“认识”后，这张卡从复习列表移除
    if (reviewMode && kind === "known") {

        order.splice(pos, 1);

        if (pos >= order.length) pos = 0;

        flipped = false;

        render();

        return;
    }

    go(1);
}


async function start() {

    if (!hasLesson) {

        show("loadingArea", false);
        show("pickerArea", true);

        BoBoKa.lessonPicker(
            $("pickerArea"), "flashcards.html", "选择要练习单词的一课"
        );

        return;
    }

    try {

        const result = await BoBoKa.api(
            `/api/courses/${encodeURIComponent(courseCode)}/lessons/${lessonNumber}`
        );

        const data = result.data;
        const lesson = data.lesson;

        $("courseLabel").textContent = lesson.course_title;
        $("lessonTitle").textContent = `Lesson ${lesson.lesson_number} · ${lesson.title}`;
        $("lessonChinese").textContent = lesson.chinese_title || "";

        const lessonLink = BoBoKa.lessonUrl("lesson.html", courseCode, lessonNumber);

        $("backLesson").href = lessonLink;
        $("emptyBack").href = lessonLink;

        words = [];

        for (const group of data.vocabulary || []) {
            for (const w of group.words || []) {
                words.push({
                    id: w.id,
                    word: w.word,
                    ipa: w.ipa,
                    chinese: w.chinese,
                    category: group.category,
                    chineseCategory: group.chineseCategory
                });
            }
        }

        show("loadingArea", false);

        if (words.length === 0) {

            if (lesson.content_status === "empty") {
                $("emptyTitle").textContent = "本课教材内容待补充";
                $("emptyText").textContent = "这一课的单词还没有录入。";
            }

            else {
                $("emptyText").textContent = "教材内容待补充。";
            }

            show("emptyArea", true);

            return;
        }

        // 我保存过的标记（来自服务器）
        const marks = data.my_progress.flashcards || {};

        words.forEach(w => {

            if (marks[w.id] === "known") known.add(w.id);
            else if (marks[w.id] === "practice") practice.add(w.id);
        });

        show("deckArea", true);

        buildOrder(false);
        render();

    }

    catch (error) {

        show("loadingArea", false);
        show("errorArea", true);

        $("errorText").textContent = error.message;
    }
}


$("card").addEventListener("click", () => {
    if (order.length === 0) return;
    flipped = !flipped;
    $("card").classList.toggle("flipped", flipped);
});

$("prevButton").addEventListener("click", () => go(-1));
$("nextButton").addEventListener("click", () => go(1));
$("knownButton").addEventListener("click", () => mark("known"));
$("practiceButton").addEventListener("click", () => mark("practice"));

$("shuffleButton").addEventListener("click", () => {
    buildOrder(true);
    flipped = false;
    render();
});

$("modeButton").addEventListener("click", () => {
    reviewMode = !reviewMode;
    buildOrder(false);
    flipped = false;
    render();
});

$("resetButton").addEventListener("click", () => {
    if (!confirm("清除本课所有“认识 / 需要练习”标记？")) return;
    known.clear();
    practice.clear();
    BoBoKa.del(BoBoKa.lessonApi(courseCode, lessonNumber, "/flashcards"))
        .catch(error => { $("saveWarning").textContent = "⚠ 重置没有保存成功：" + error.message; });
    reviewMode = false;
    buildOrder(false);
    flipped = false;
    render();
});

document.addEventListener("keydown", event => {

    if (!$("deckArea") || $("deckArea").style.display === "none") return;

    if (event.key === "ArrowRight") go(1);
    else if (event.key === "ArrowLeft") go(-1);
    else if (event.key === " ") {
        event.preventDefault();
        $("card").click();
    }
});

start();

</script>

</body>
</html>
